name: Seguridad IaC

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  iac:
    name: Escaneo IaC
    runs-on: ubuntu-latest
    permissions:
      contents: read
      security-events: write
    steps:
      - name: Descargar codigo
        uses: actions/checkout@v4

      - name: Preparar Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Instalar Checkov con version fija
        run: python -m pip install -r requirements-iac.txt

      - name: Generar reporte SARIF
        run: >-
          checkov -d . --skip-path ejemplos-politica --framework terraform dockerfile
          --external-checks-dir politicas
          -o sarif --output-file-path reportes --soft-fail

      - name: Guardar reporte descargable
        if: ${{ always() && hashFiles('reportes/results_sarif.sarif') != '' }}
        uses: actions/upload-artifact@v4
        with:
          name: checkov-sarif
          path: reportes/results_sarif.sarif
          if-no-files-found: error

      - name: Publicar en Code Scanning
        if: ${{ always() && github.event.repository.private == false && (github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository) && hashFiles('reportes/results_sarif.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: reportes/results_sarif.sarif
          category: checkov

      - name: Gate Checkov
        if: ${{ !cancelled() }}
        run: >-
          checkov -d . --skip-path ejemplos-politica --framework terraform dockerfile
          --external-checks-dir politicas --compact

      - name: Verificar caso que pasa de politica propia
        if: ${{ !cancelled() }}
        run: >-
          checkov -d ejemplos-politica/pasa --framework terraform
          --external-checks-dir politicas --check CKV2_DEMO_1 --compact

      - name: Verificar que la politica rechaza el caso inseguro
        if: ${{ !cancelled() }}
        shell: bash
        run: |
          set +e
          checkov -d ejemplos-politica/falla --framework terraform \
            --external-checks-dir politicas --check CKV2_DEMO_1 --compact
          resultado=$?
          set -e
          if [ "$resultado" -ne 1 ]; then
            echo "Se esperaba codigo 1 por incumplimiento; recibido: $resultado"
            exit 1
          fi
